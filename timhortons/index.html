<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tim Hortons Canada — Order Assistant</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    :root {
      --th-red: #D52B1E;
      --th-red-dark: #A31F16;
      --th-gold: #D9A566;
      --th-cream: #FFF8EC;
      --th-ink: #2B1A12;
      --th-line: #EADFC9;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      /* only #messages should scroll, not the whole page */
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--th-cream);
      color: var(--th-ink);
    }

    .wrap {
      max-width: 480px;
      margin: 0 auto;
      height: 100vh;
      /* fallback for older browsers */
      height: 100dvh;
      /* actual visible viewport on mobile, updates with address bar/keyboard */
      display: flex;
      flex-direction: column;
      background: #fff;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.08);
    }

    header {
      background: var(--th-red);
      color: #fff;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header .badge {
      width: 36px;
      height: 36px;
      background: var(--th-gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--th-red-dark);
    }

    header h1 {
      font-size: 16px;
      margin: 0;
      line-height: 1.2;
    }

    header p {
      font-size: 12px;
      margin: 2px 0 0;
      opacity: 0.85;
    }

    #gate {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
    }

    #gate p {
      font-size: 14px;
      color: #6b5c4c;
      margin: 0;
      max-width: 320px;
    }

    #gate-error {
      color: var(--th-red);
      font-size: 13px;
      min-height: 18px;
    }

    #gate-retry-btn {
      display: none;
      font-size: 13px;
      font-weight: 600;
      color: var(--th-red);
      background: none;
      border: 1px solid var(--th-red);
      border-radius: 100px;
      padding: 6px 16px;
      cursor: pointer;
    }

    #gate-retry-btn:hover { background: var(--th-red); color: #fff; }

    /* Facebook/Instagram/TikTok/etc. in-app browsers are known to break
       cross-origin fetches (the Turnstile widget itself can pass while our
       own verify request silently fails) — shown only when that UA is
       detected, see isInAppBrowser() in timhortons.js. */
    #inapp-banner {
      display: none;
      flex-direction: column;
      gap: 8px;
      background: #FFF3D6;
      color: #6b4f1d;
      font-size: 12.5px;
      padding: 10px 14px;
    }

    .inapp-banner-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    #inapp-banner-close {
      background: none;
      border: none;
      color: inherit;
      font-size: 17px;
      line-height: 1;
      cursor: pointer;
      opacity: 0.7;
      padding: 0;
      flex-shrink: 0;
    }

    .inapp-banner-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .inapp-btn {
      font-size: 12.5px;
      font-weight: 600;
      text-decoration: none;
      padding: 7px 14px;
      border-radius: 100px;
      cursor: pointer;
      border: 1px solid #6b4f1d;
    }

    a.inapp-btn {
      background: #6b4f1d;
      color: #fff;
    }

    button.inapp-btn {
      background: none;
      color: #6b4f1d;
      font-family: inherit;
    }

    #chat-view {
      display: none;
      flex: 1;
      flex-direction: column;
      min-height: 0;
    }

    #messages {
      flex: 1;
      min-height: 0;
      /* without this, flex children won't shrink and #messages pushes the input off-screen instead of scrolling internally */
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--th-gold);
      color: var(--th-ink);
      border-bottom-right-radius: 4px;
    }

    .msg.bot {
      align-self: flex-start;
      background: var(--th-cream);
      border: 1px solid var(--th-line);
      border-bottom-left-radius: 4px;
    }

    .msg.staff {
      align-self: flex-start;
      background: var(--th-gold);
      color: var(--th-ink);
      border: 1px solid #e0a800;
      border-bottom-left-radius: 4px;
      font-weight: 500;
    }

    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 14px 16px;
      align-items: center;
    }

    .typing-indicator span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--th-ink);
      opacity: 0.4;
      animation: th-typing-bounce 1.2s infinite ease-in-out;
    }

    .typing-indicator span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing-indicator span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes th-typing-bounce {

      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: 0.4;
      }

      30% {
        transform: translateY(-4px);
        opacity: 0.9;
      }
    }

    .msg.error {
      align-self: center;
      background: #fdecec;
      color: var(--th-red-dark);
      border: 1px solid #f3c9c9;
      font-size: 13px;
    }

    form {
      display: flex;
      gap: 8px;
      padding: 14px 16px;
      border-top: 1px solid var(--th-line);
    }

    input[type=text] {
      flex: 1;
      padding: 12px 14px;
      border-radius: 22px;
      border: 1px solid var(--th-line);
      font-size: 14px;
      outline: none;
    }

    input[type=text]:focus {
      border-color: var(--th-red);
    }

    button.send {
      background: var(--th-red);
      color: #fff;
      border: none;
      padding: 0 20px;
      border-radius: 22px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    button.send:hover {
      background: var(--th-red-dark);
    }

    button.send:disabled {
      opacity: 0.5;
      cursor: default;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div id="inapp-banner">
      <div class="inapp-banner-row">
        <span>Chat may not load properly in this app's built-in browser.</span>
        <button id="inapp-banner-close" aria-label="Dismiss">&times;</button>
      </div>
      <div class="inapp-banner-actions">
        <a id="inapp-open-link" class="inapp-btn" href="#" rel="noopener">Open in Browser</a>
        <button id="inapp-copy-btn" class="inapp-btn" type="button">Copy link</button>
      </div>
    </div>

    <header>
      <div class="badge">TH</div>
      <div>
        <h1>Tim Hortons Canada</h1>
        <p>Ask about the menu or place an order</p>
      </div>
    </header>

    <div id="gate">
      <p>Quick check before we start — this helps keep the demo running smoothly for everyone.</p>
      <div class="cf-turnstile" data-sitekey="0x4AAAAAAEp3iBget7hpTH-x" data-callback="onTurnstileSuccess"></div>
      <div id="gate-error"></div>
      <button id="gate-retry-btn" type="button">Try again</button>
    </div>

    <div id="chat-view">
      <div id="messages"></div>
      <form id="chat-form">
        <input type="text" id="chat-input" placeholder="Type your order..." autocomplete="off" />
        <button type="submit" class="send">Send</button>
      </form>
    </div>
  </div>

  <script src="timhortons.js"></script>
</body>

</html>

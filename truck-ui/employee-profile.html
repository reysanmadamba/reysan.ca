<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Employee Details</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="demo-banner"><span class="demo-tag">Demo — no data is saved (Property of Planetcom)</span></div>

  <div class="profile-page">
    <div class="profile-card">
      <h1>Employee Details</h1>

      <div class="profile-row"><span class="label">Name</span><span class="value">John Doe</span></div>
      <div class="profile-row"><span class="label">Phone</span><span class="value">587-123-4567</span></div>
      <div class="profile-row"><span class="label">SIN</span><span class="value">123-123</span></div>
      <div class="profile-row"><span class="label">Status</span><span class="value">Active</span></div>
      <div class="profile-row"><span class="label">Role</span><span class="value">Driver</span></div>
      <div class="profile-row"><span class="label">Type</span><span class="value">Full-time</span></div>
      <div class="profile-row"><span class="label">Start Date</span><span class="value">January 1, 2018</span></div>
      <div class="profile-row"><span class="label">Emergency Contact Name</span><span class="value">Jennie Kim</span></div>
      <div class="profile-row"><span class="label">Relation</span><span class="value">Spouse</span></div>
      <div class="profile-row" style="border-bottom:none;"><span class="label">Emergency Contact Number</span><span class="value">587-321-9432</span></div>

      <div class="maintenance-title">Certificates</div>
      <a class="btn-view" href="employee-profile.html">Click to view images</a>

      <div class="decision-row" style="margin-top:24px;">
        <a href="employee-profile-edit.html" class="btn btn-primary">Edit</a>
      </div>
    </div>
  </div>

</body>
</html>

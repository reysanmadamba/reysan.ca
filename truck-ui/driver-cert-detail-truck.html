<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alberta Trucks Certificate</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="demo-banner"><span class="demo-tag">Demo — no data is saved (Property of Planetcom)</span></div>

  <div class="profile-page">
    <div class="profile-card" style="max-width: 420px;">
      <h1 style="text-align:left; margin-bottom:14px;">Alberta Trucks Certificate</h1>

      <div class="asset-photo" style="aspect-ratio: 3/4; max-width:260px; margin: 0 auto 20px;">
        <svg width="100%" height="100%" viewBox="0 0 260 340" xmlns="http://www.w3.org/2000/svg">
          <rect width="260" height="340" fill="#fdfdfc" stroke="#dbe1de" stroke-width="2"/>
          <text x="130" y="34" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#3a4440">Alberta Trucks Certificate</text>
          <path d="M30 90 Q 60 70 90 90 T 150 90 T 210 90" stroke="#9aa39d" fill="none" stroke-width="1.5"/>
          <path d="M30 120 Q 60 100 90 120 T 150 120 T 210 120" stroke="#9aa39d" fill="none" stroke-width="1.5"/>
          <path d="M30 150 Q 60 130 90 150 T 150 150" stroke="#9aa39d" fill="none" stroke-width="1.5"/>
          <circle cx="185" cy="270" r="30" fill="none" stroke="#c9d0cb" stroke-width="1.5"/>
          <text x="185" y="274" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8a938e">JD</text>
        </svg>
      </div>

      <div class="field-box" style="margin-bottom: 14px;">
        <label>Name</label>
        <div class="value-box">Alberta Trucks Certificate</div>
      </div>

      <div class="expiration-row">
        Expiration:
        <input class="box-input" type="text" value="Dec">
        <input class="box-input" type="text" value="31">
        <input class="box-input year" type="text" value="2026">
      </div>

      <div class="confirm-actions" style="justify-content:space-between;">
        <a href="driver-certification.html" class="btn btn-primary">Save</a>
        <a href="driver-cert-detail-truck.html" class="btn">Edit</a>
        <a href="driver-certification.html" class="btn btn-refuse">Delete</a>
      </div>
    </div>
  </div>

</body>
</html>

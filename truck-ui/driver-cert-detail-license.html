<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Driver License Class 1</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="demo-banner"><span class="demo-tag">Demo — no data is saved (Property of Planetcom)</span></div>

  <div class="profile-page">
    <div class="profile-card" style="max-width: 420px;">
      <h1 style="text-align:left; margin-bottom:14px;">Driver License Class 1</h1>

      <div class="asset-photo" style="aspect-ratio: 3/4; max-width:260px; margin: 0 auto 20px;">
        <svg width="100%" height="100%" viewBox="0 0 260 340" xmlns="http://www.w3.org/2000/svg">
          <rect width="260" height="340" fill="#fdfdfc" stroke="#dbe1de" stroke-width="2"/>
          <text x="130" y="34" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#3a4440">Driver License Class 1</text>
          <rect x="30" y="60" width="90" height="90" fill="#eef1ef" stroke="#c9d0cb"/>
          <rect x="130" y="65" width="100" height="8" fill="#dbe1de"/>
          <rect x="130" y="80" width="100" height="8" fill="#dbe1de"/>
          <rect x="130" y="95" width="70" height="8" fill="#dbe1de"/>
          <rect x="30" y="170" width="200" height="8" fill="#dbe1de"/>
          <rect x="30" y="188" width="200" height="8" fill="#dbe1de"/>
        </svg>
      </div>

      <div class="field-box" style="margin-bottom: 14px;">
        <label>Name</label>
        <div class="value-box">Driver License Class 1</div>
      </div>

      <div class="expiration-row">
        Expiration:
        <input class="box-input" type="text" value="Aug">
        <input class="box-input" type="text" value="30">
        <input class="box-input year" type="text" value="2026">
      </div>

      <div class="confirm-actions" style="justify-content:space-between;">
        <a href="driver-certification.html" class="btn btn-primary">Save</a>
        <a href="driver-cert-detail-license.html" class="btn">Edit</a>
        <a href="driver-certification.html" class="btn btn-refuse">Delete</a>
      </div>
    </div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deck Truck History</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="demo-banner"><span class="demo-tag">Demo — no data is saved (Property of Planetcom)</span></div>

  <div class="form-page">
    <div class="form-card">
      <h1>Deck Truck History</h1>

      <div class="field-grid">
        <div class="field-box">
          <label>Title</label>
          <div class="value-box">flat left front tire</div>
        </div>
        <div class="field-box">
          <label>Date</label>
          <div class="value-box">2025-12-11</div>
        </div>

        <div class="field-box">
          <label>Requester Name</label>
          <div class="value-box">James Smith</div>
        </div>
        <div class="field-box"></div>

        <div class="field-box">
          <label>Equipment of Concern</label>
          <div class="value-box">Deck Truck</div>
        </div>
        <div class="field-box"></div>

        <div class="field-box">
          <label>Mileage at time of request</label>
          <div class="value-box">
            399,299
            <span class="unit">/km</span>
          </div>
        </div>
        <div class="field-box"></div>

        <div class="field-box">
          <label>Model #</label>
          <div class="value-box empty">—</div>
        </div>
        <div class="field-box">
          <label>Serial Number</label>
          <div class="value-box empty">—</div>
        </div>
      </div>

      <a class="btn-view" href="deck-truck-history-view.html" style="margin-bottom:22px; display:inline-block;">View image/s</a>

      <div class="field-box span-2" style="margin-bottom: 22px;">
        <label>Description of service requested</label>
        <div class="textarea-box">hit the curb so bad, the left front tire need to be fixed</div>
      </div>

      <div class="criteria-label">Service Criteria</div>
      <div class="criteria-row">
        <label class="criteria-option">
          <input type="radio" name="criteria">
          Minor Defect
        </label>
        <label class="criteria-option">
          <input type="radio" name="criteria">
          Major Defect
        </label>
        <label class="criteria-option">
          <input type="radio" name="criteria" checked>
          Out of Service
        </label>
      </div>

      <div class="profile-row" style="border:none; padding-top:14px;">
        <span class="label">Approved by</span><span class="value">admin</span>
      </div>
      <div class="profile-row" style="border:none; padding-bottom:0;">
        <span class="label">Date approved</span><span class="value">2025-12-12</span>
      </div>

      <div class="decision-row">
        <a href="deck-truck-history.html" class="btn btn-primary">Edit</a>
      </div>
    </div>
  </div>

</body>
</html>

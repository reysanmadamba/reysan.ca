<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Employee Details</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="demo-banner"><span class="demo-tag">Demo — no data is saved (Property of Planetcom)</span></div>

  <div class="profile-page">
    <div class="profile-card">
      <h1>Employee Details</h1>

      <div class="field-box" style="margin-bottom: 12px;">
        <label>Name</label>
        <div class="value-box empty">—</div>
      </div>
      <div class="field-box" style="margin-bottom: 12px;">
        <label>Phone</label>
        <div class="value-box empty">—</div>
      </div>
      <div class="field-box" style="margin-bottom: 12px;">
        <label>SIN</label>
        <div class="value-box empty">—</div>
      </div>
      <div class="field-grid" style="grid-template-columns: 1fr 1fr;">
        <div class="field-box">
          <label>Role</label>
          <div class="value-box empty">—</div>
        </div>
        <div class="field-box">
          <label>Type</label>
          <div class="select-wrap">
            <select><option>Full-time</option><option>Part-time</option><option>Contract</option></select>
          </div>
        </div>
      </div>
      <div class="field-box" style="margin-bottom: 12px;">
        <label>Start Date</label>
        <div class="value-box empty">—</div>
      </div>
      <div class="field-box" style="margin-bottom: 12px;">
        <label>Emergency Contact Name</label>
        <div class="value-box empty">—</div>
      </div>
      <div class="field-box" style="margin-bottom: 12px;">
        <label>Relation</label>
        <div class="value-box empty">—</div>
      </div>
      <div class="field-box" style="margin-bottom: 18px;">
        <label>Emergency Contact Number</label>
        <div class="value-box empty">—</div>
      </div>

      <a href="employee-cert-upload.html" class="add-link"><span class="plus">+</span> ADD CERTIFICATE</a>

      <div class="decision-row" style="margin-top:24px;">
        <a href="employees.html" class="btn btn-primary">Save</a>
        <a href="employees.html" class="btn">Cancel</a>
      </div>
    </div>
  </div>

</body>
</html>

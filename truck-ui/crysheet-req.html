<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cry Sheet Request</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="demo-banner"><span class="demo-tag">Demo — no data is saved (Property of Planetcom)</span></div>

  <div class="form-page">
    <div class="form-card">
      <h1>Cry Sheet Request</h1>

      <div class="field-grid">
        <div class="field-box">
          <label>Title</label>
          <div class="value-box">broken pressure readings</div>
        </div>
        <div class="field-box">
          <label>Date</label>
          <div class="value-box">2026-08-12</div>
        </div>

        <div class="field-box">
          <label>Requester Name</label>
          <div class="value-box">John Doe</div>
        </div>
        <div class="field-box"></div>

        <div class="field-box">
          <label>Equipment of Concern</label>
          <a class="value-box" href="deck-truck.html" style="text-decoration:none; color:inherit; justify-content:space-between;">
            Deck Truck
            <span class="link-pill">View details</span>
          </a>
        </div>
        <div class="field-box"></div>

        <div class="field-box">
          <label>Mileage at time of request</label>
          <div class="value-box">
            469,299
            <span class="unit">/km</span>
          </div>
        </div>
        <div class="field-box"></div>

        <div class="field-box">
          <label>Model #</label>
          <div class="value-box empty">—</div>
        </div>
        <div class="field-box">
          <label>Serial Number</label>
          <div class="value-box empty">—</div>
        </div>
      </div>

      <div class="field-box span-2" style="margin-bottom: 22px;">
        <label>Description of service requested</label>
        <div class="textarea-box">Inaccurate pressure readings causing derating</div>
      </div>

      <div class="criteria-label">Service Criteria</div>
      <div class="criteria-row">
        <label class="criteria-option">
          <input type="radio" name="criteria">
          Minor Defect
        </label>
        <label class="criteria-option">
          <input type="radio" name="criteria">
          Major Defect
        </label>
        <label class="criteria-option">
          <input type="radio" name="criteria" checked>
          Out of Service
        </label>
      </div>

      <div class="decision-row">
        <a href="index.html" class="btn btn-approve">Approve</a>
        <a href="index.html" class="btn btn-refuse">Refuse</a>
        <a href="index.html" class="btn btn-review">Under Review</a>
      </div>
    </div>
  </div>

</body>
</html>

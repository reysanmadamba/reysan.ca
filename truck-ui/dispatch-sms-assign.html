<title>Send SMS to Driver</title>

</head>

        <span class="sms-to">John Doe,</span>
      </div>

- Truck - Quad
- D41 Dozer

Address: 1 - 2nd street, AB
August 12, 2026

      <div class="sms-actions">
        <a href="dispatch.html" class="btn btn-primary">Send</a>

    </div>
  </div>
